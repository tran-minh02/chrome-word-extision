<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Saver</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
            <path d="M6 6h10"></path>
            <path d="M6 10h10"></path>
          </svg>
        </div>
        <div class="brand-info">
          <h1>Vocab Saver</h1>
          <span class="sub-text">Lưu & Học từ vựng</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-open-dashboard" class="icon-btn" title="Mở Bảng Quản Lý Chi Tiết (Dashboard)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
        </button>
        <button id="btn-open-dashboard-top" class="icon-btn" title="Mở trong tab mới">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Danh sách từ gần đây -->
    <section class="recent-section">
      <div class="section-header">
        <div class="section-title-wrap">
          <span class="section-title">Từ đã lưu gần đây</span>
          <span id="recent-count" class="badge">0</span>
        </div>
        <button type="button" id="btn-toggle-en-detail" class="btn-toggle-en active"
          title="Bật/tắt hiển thị định nghĩa chi tiết tiếng Anh">
          <span class="en-toggle-dot"></span>
          <span>Detail</span>
        </button>
      </div>
      <div id="recent-list" class="recent-list">
        <!-- Render bằng JS -->
        <div class="empty-state">
          <p>Chưa có từ nào. Bôi đen từ trên web & click chuột phải để lưu!</p>
        </div>
      </div>
    </section>

    <!-- Khối kết quả tra cứu nhanh (chỉ xem, không lưu) -->
    <section id="quick-search-section" class="quick-search-section" style="display: none;">
      <div class="search-result-header">
        <div class="search-result-title-group">
          <span id="search-res-word" class="search-result-word"></span>
          <span id="search-res-phonetic" class="search-result-phonetic"></span>
          <span id="search-res-pos" class="search-result-pos" style="display: none;"></span>
          <button type="button" id="search-res-audio" class="item-btn" title="Phát âm" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
          </button>
        </div>
        <button type="button" id="btn-close-search" class="search-close-btn" title="Đóng tra cứu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div id="search-res-loading" class="search-loading" style="display: none;">
        <span class="search-spinner"></span>
        <span>Đang tra cứu API...</span>
      </div>

      <div id="search-res-body" class="search-result-body">
        <div id="search-res-vi" class="search-result-vi"></div>
        <div id="search-res-en-wrap" class="search-result-en" style="display: none;">
          <span class="en-tag">EN</span>
          <span id="search-res-en" class="en-text"></span>
        </div>
        <div id="search-res-example" class="search-result-example" style="display: none;"></div>
      </div>

      <div id="search-res-footer" class="search-result-footer" style="display: none;">
        <span class="search-result-badge-tag">⚡ Tra cứu • Chưa lưu</span>
        <button type="button" id="btn-save-searched-word" class="btn-save-searched" title="Lưu từ này vào danh sách học">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Lưu từ này</span>
        </button>
      </div>
    </section>

    <!-- Form thêm từ & tra cứu nhanh -->
    <section class="quick-add-section">
      <form id="quick-add-form" class="quick-add-row-form">
        <input type="text" id="quick-word" placeholder="Give your word here ..." required autocomplete="off">
        <button type="button" id="btn-quick-search" class="btn-search-inline" title="Chỉ tra cứu bằng API (không lưu)" aria-label="Tra cứu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        <button type="submit" id="btn-quick-add" class="btn-primary-inline" title="Lưu vào danh sách từ vựng" aria-label="Thêm từ vựng">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </form>
    </section>
  </div>

  <script src="popup.js"></script>
</body>

</html>
