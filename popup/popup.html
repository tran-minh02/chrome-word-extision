<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Saver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
            <path d="M6 6h10"></path>
            <path d="M6 10h10"></path>
          </svg>
        </div>
        <div class="brand-info">
          <h1>Vocab Saver</h1>
          <span class="sub-text">Lưu & Học từ vựng</span>
        </div>
      </div>
      <button id="btn-open-dashboard-top" class="icon-btn" title="Mở bảng quản lý">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </button>
    </header>

    <!-- Thống kê nhanh -->
    <section class="stats-row">
      <div class="stat-card">
        <span class="stat-number" id="stat-total">0</span>
        <span class="stat-label">Tổng từ</span>
      </div>
      <div class="stat-card card-learning">
        <span class="stat-number" id="stat-learning">0</span>
        <span class="stat-label">Đang học</span>
      </div>
      <div class="stat-card card-mastered">
        <span class="stat-number" id="stat-mastered">0</span>
        <span class="stat-label">Đã thuộc</span>
      </div>
    </section>

    <!-- Form thêm từ nhanh -->
    <section class="quick-add-section">
      <div class="section-title">Thêm từ nhanh</div>
      <form id="quick-add-form" class="quick-add-form">
        <div class="input-group">
          <input type="text" id="quick-word" placeholder="Nhập từ tiếng Anh..." required autocomplete="off">
        </div>
        <div class="input-group">
          <input type="text" id="quick-meaning" placeholder="Nghĩa tiếng Việt (tùy chọn)..." autocomplete="off">
        </div>
        <button type="submit" id="btn-quick-add" class="btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Lưu từ</span>
        </button>
      </form>
    </section>

    <!-- Danh sách từ gần đây -->
    <section class="recent-section">
      <div class="section-header">
        <span class="section-title">Từ đã lưu gần đây</span>
        <span id="recent-count" class="badge">0</span>
      </div>
      <div id="recent-list" class="recent-list">
        <!-- Render bằng JS -->
        <div class="empty-state">
          <p>Chưa có từ nào. Bôi đen từ trên web & click chuột phải để lưu!</p>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="popup-footer">
      <button id="btn-open-dashboard" class="btn-dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
        <span>Mở Bảng Quản Lý Chi Tiết (Dashboard)</span>
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
